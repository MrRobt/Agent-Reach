# GitHub Actions CI for Agent Reach
#
# Lint (ruff) + test (pytest) on Python 3.10/3.11/3.12 across OS.
# Mirrors the upstream test discipline; this fork adds 4 new channels
# (bluesky/twitch/threads/tiktok) so we want CI to catch regressions.

name: CI

on:
  push:
    branches: [main, feat/**, docs/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check agent_reach/

      - name: Run ruff format check
        run: ruff format --check agent_reach/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run pytest
        run: pytest tests/ -v --tb=short -q
